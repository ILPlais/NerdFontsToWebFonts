# .github/workflows/nerd-fonts-woff2-release.yml
#
# Watches the official Nerd Fonts repository for new releases, converts all
# the fonts to WOFF2, creates one .zip and one .tar.xz archive per family,
# then publishes a release carrying the same version number as Nerd Fonts.
#
# 🚀 One family = one job running in parallel with the others (matrix), to
# stay well under the 6 h per-job limit even with ~50 families.

name: 🔣 Nerd Fonts → WOFF2

on:
  # ⏰ Check every day whether a new upstream release exists
  schedule:
    - cron: "0 6 * * *"

  # 🖱️ Manual trigger, with the option to force a specific tag
  workflow_dispatch:
    inputs:
      tag:
        description: "Nerd Fonts tag to convert (e.g. v3.5.1). Empty = latest release."
        required: false
        default: ""

# 🔒 Minimal permissions by default; only the publish job writes
permissions:
  contents: read

# 🚦 Prevent two full workflow runs from happening at the same time
concurrency:
  group: nerd-fonts-woff2
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Job 1: determine the tag, check it hasn't already been published, and
  # list the font families to process (used as the matrix afterwards)
  # ---------------------------------------------------------------------------
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      needs_release: ${{ steps.resolve.outputs.needs_release }}
      families: ${{ steps.resolve.outputs.families }}
    steps:
      - name: 🔎 Resolve the tag, release existence, and family list
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          # Passed through the environment (rather than interpolated into the
          # script) to prevent command injection via the manual input
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          # Manually requested tag, otherwise the latest Nerd Fonts release
          tag="${INPUT_TAG:-}"
          if [ -z "$tag" ]; then
            tag=$(gh api repos/ryanoasis/nerd-fonts/releases/latest --jq .tag_name)
          fi
          echo "🏷️ Targeted Nerd Fonts tag: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          # If a release with this tag already exists in THIS repository, stop
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "⏭️ Release $tag already exists, nothing to do."
            echo "needs_release=false" >> "$GITHUB_OUTPUT"
            echo "families=[]" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "🆕 Release $tag doesn't exist yet: starting the conversion."
          echo "needs_release=true" >> "$GITHUB_OUTPUT"

          # Family list = names of the release's .zip archives, without the
          # extension. The resulting JSON is used as the matrix for "build".
          release_json=$(gh api "repos/ryanoasis/nerd-fonts/releases/tags/$tag")
          families=$(echo "$release_json" \
            | jq -c '[.assets[] | select(.name | endswith(".zip")) | (.name | sub("\\.zip$"; ""))]')
          echo "🔤 $(echo "$families" | jq length) famil(y/ies) found"
          echo "families=$families" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Job 2: convert and archive ONE family per matrix instance, in parallel.
  # If one family fails, the others keep going (fail-fast: false) to make
  # diagnosing easier.
  # ---------------------------------------------------------------------------
  build:
    needs: check
    if: needs.check.outputs.needs_release == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 10   # tune to the number of concurrent jobs your plan allows
      matrix:
        family: ${{ fromJson(needs.check.outputs.families) }}
    env:
      NERD_FONTS_TAG: ${{ needs.check.outputs.tag }}
      FAMILY: ${{ matrix.family }}
      # Automatically read by the Python script (--github-token option) to
      # benefit from a more comfortable API rate limit
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: 📥 Check out the repository
        uses: actions/checkout@v7

      - name: 🐍 Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: 📦 Install fontTools (with WOFF2/Brotli support)
        run: pip install "fonttools[woff]"

      - name: 🔁 Download and convert this family
        run: |
          python3 DownloadAndConvertNerdFonts.py \
            --tag "$NERD_FONTS_TAG" \
            --families "$FAMILY" \
            --output-dir ./woff2

      - name: 🗜️ Create the .zip and .tar.xz archives for this family
        run: |
          set -euo pipefail

          mkdir --parents dist

          # Use all available cores for xz compression
          export XZ_OPT="--threads=0"

          # .zip: we move into woff2/ so that the archive contains a root
          # folder named after the family
          (cd woff2 && zip --recurse-paths --quiet "../dist/${FAMILY}.zip" "$FAMILY")

          # .tar.xz: same internal structure thanks to --directory
          tar --create --xz --file "dist/${FAMILY}.tar.xz" \
            --directory woff2 "$FAMILY"

      - name: 📤 Upload the archives as a workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: archive-${{ matrix.family }}
          path: dist/*
          retention-days: 1   # consumed right away by the publish job

  # ---------------------------------------------------------------------------
  # Job 3: only runs once EVERY family has been converted successfully.
  # Gathers all the artifacts and publishes a single release.
  # ---------------------------------------------------------------------------
  publish:
    needs: [check, build]
    if: needs.check.outputs.needs_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # required to create the tag and the release
    env:
      NERD_FONTS_TAG: ${{ needs.check.outputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: 📥 Download all family archives
        uses: actions/download-artifact@v8
        with:
          pattern: archive-*
          path: dist
          merge-multiple: true

      - name: 🚀 Publish the release
        run: |
          set -euo pipefail

          echo "🚀 Creating release $NERD_FONTS_TAG"

          gh release create "$NERD_FONTS_TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Nerd Fonts $NERD_FONTS_TAG (WOFF2)" \
            --notes "Nerd Fonts $NERD_FONTS_TAG fonts converted to WOFF2. Source: https://github.com/ryanoasis/nerd-fonts/releases/tag/$NERD_FONTS_TAG"

          echo "🎉 Release $NERD_FONTS_TAG published!"
